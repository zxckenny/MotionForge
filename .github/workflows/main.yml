name: Build MotionForge Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Ускоряет сборку и стабильнее работает

      - name: Install dependencies
        run: npm ci # Если нет package-lock.json, замени на npm install

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle' # Ускоряет сборку Gradle

      - name: Install Capacitor CLI (just in case)
        run: npm install -g @capacitor/cli

      # ВАЖНО: Если папки android нет в репозитории, она создастся.
      # Если она уже есть, npx cap add android выдаст ошибку. 
      # Поэтому используем условие: добавляем, только если папки нет.
      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add."
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionForge-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
